[project]
name = "flowgram-flow-backend-python"
version = "0.1.0"
description = "Flowgram workflow studio Python backend: workflow CRUD + auth + LangGraph runtime execution"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # LangGraph execution engine (replaces @flowgram.ai/runtime-js-core)
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    # Database (mirrors Prisma schema in apps/flow-backend/prisma)
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    # Validation / config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Crypto: AES-256-GCM compatible with Node's enc:: format (lib/crypto.ts)
    "cryptography>=43.0.0",
    # HTTP client (replaces Node's global fetch in executor nodes)
    "httpx>=0.27.0",
    # Structured logging (grill decision: observability route 2)
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
